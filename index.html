<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integration Ninja</title>
<meta name="description" content="APIs, middleware and messaging explained simply, for integration engineers.">
<!-- Render-blocking on purpose: the theme is resolved before paint, so the page
     never flashes the wrong colours. If either file fails to load, the
     data-theme="light" already on <html> stands. -->
<script src="assets/js/config.js"></script>
<script src="assets/js/lib/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="site-header__inner shell">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true">I</span>
      <span>
        <span class="brand__title">Integration Ninja</span>
        <span class="brand__tagline"></span>
      </span>
    </a>
    <button type="button" class="theme-toggle" aria-label="Switch theme">☾</button>
  </div>
</header>

<main id="main" class="shell">
  <h1 class="visually-hidden">Articles</h1>

  <div class="filters">
    <form class="search" role="search">
      <label class="visually-hidden" for="q">Search articles</label>
      <input type="search" id="q" class="search__input" placeholder="Search titles, tags and text…" autocomplete="off">
      <button type="button" id="q-clear" class="search__clear" aria-label="Clear search" hidden>×</button>
    </form>
    <div id="tagbar" class="tagbar"></div>
  </div>

  <p id="result-count" class="result-count" aria-live="polite"></p>

  <ul id="feed" class="feed">
    <li class="state">Loading articles…</li>
  </ul>

  <nav id="pager" class="pager" aria-label="Pagination"></nav>
</main>

<footer class="site-footer">
  <div class="site-footer__inner shell">
    <span>© <span class="footer-year"></span> <span class="footer-author"></span></span>
    <span>Written for integration engineers who would like the docs to be shorter.</span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="assets/js/lib/frontmatter.js"></script>
<script src="assets/js/lib/format.js"></script>
<script src="assets/js/lib/store.js"></script>
<script src="assets/js/lib/search.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/home.js"></script>

</body>
</html>
